  突然回想起来为什么高中的时候，只要在路上遇到叫得上名字的人我都会主动打招呼。
  <br/>
  大概是九年前的事情了，那是初中毕业的一个暑假，因为一个偶然的机会我听到了一个女孩子的心事。她和我是初中同学，她说考完考试之后在暑假某一天她来到学校，遇到很多同学，她去和那些人打招呼他们都不理她，就算面对面经过也跟不认识一样。然后她在电话里哭了好久，我理解这种孤独和难堪，我说如果是我的话一定会和你打招呼的。那天晚上听她讲了好多心事，直到她睡着。
  <br/>
  自从那天之后，无论在学校里面遇到谁我都会主动凑上去打招呼，无论对方会热烈地回应还是爱答不理。
