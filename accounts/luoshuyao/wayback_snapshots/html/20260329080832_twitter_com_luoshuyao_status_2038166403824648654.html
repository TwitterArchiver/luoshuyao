  我真的知道错了……

  昨天晚上刷到一个人说这里怎么这么多自残的内容，然后评论区里面有个人@了一个账号，那个人回复说看着就好爽。我心想自残看着就疼有什么爽的，然后就点进去看看是什么。真的好奇心害死猫😿当我意识到我看到了什么的时候，一切都来不及了。那完全就是自杀式的自残。吓得我赶紧退出去了。可能是大脑的自我保护机制，我马上就忘了这个内容。结果今天中午又突然想起来了，然后我就开始头痛，一直到现在还在痛。
