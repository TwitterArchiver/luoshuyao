  <div class="tweet-content">
  我刚开始充蓝v就是因为字数限制太烦了，那个时候我的表达欲还很强，而且真的能写出来很多东西。
  <br/>
  现在感觉也就只有这一个用处了，而且充了之后流量确实也下降了。充了蓝v之后能看到自己的帖子数据，这一点确实可能会让人有点动摇，好像自己都充了钱了反而更没流量了会很亏。我发现这里流量高的蓝v大部分都是纯搬运的，搬各种梗图，复制粘贴各种文本，甚至很多都是别人发过的一样的内容。每天都是高强度发推，我做不到这样，而且这背离了我玩推的初心。
  <br/>
  所以当时我就释然了，有没有流量都无所谓，发自己想发的就够了。
