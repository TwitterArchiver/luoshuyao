  对那些搞游戏歧视的人真的很难理解。虽然我在现实和网络里从来都没有遇到过因为我玩某个游戏而讨厌我的，但是却在网上其他人那里看过不少只因玩XX游戏而对别人产生偏见的情况。还看到过很多以偏概全的发言，比如“原来是XX玩家啊，这下破案了”“玩XX玩的”“XX玩家都是这样的”……神人之所以是神人，是因为他本身就是神人，不是因为他玩了某个游戏而变成了神人，也不是只有神人才会选择这个游戏。这种把个人行为和游戏本身绑定的言论，完全是没有任何思考的。
