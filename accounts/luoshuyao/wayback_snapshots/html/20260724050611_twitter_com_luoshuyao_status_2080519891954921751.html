  <div class="tweet-content">
  说到针对能说的事太多了。
  <br/>
  比如别的组缺人的时候，别人还没有离职就提前安排好新人了，就算没招到也会安排临时工帮忙。到我们这里有人离职一个月都招不到人，看着我们天天加班都无所谓。
  <br/>
  别的组忙的时候那些领导都会亲自帮忙，我们几乎都是自己干活，半夜十二点下班也很少会来帮忙。甚至别的组忙的时候还要从我们组抽一个人过去帮忙，我们本来就缺人……上个月就是这样，为了抽一个人去帮别的组，让我们不要安排人休假了，但是那个组自己都排了人休息。为什么不让他们直接不排休？那几天刚好是排到我休息，因为这个我的假被往后推了半个月。
  <br/>
  别的组提前一个小时下班都无所谓，我们一准时下班就要被找茬。
