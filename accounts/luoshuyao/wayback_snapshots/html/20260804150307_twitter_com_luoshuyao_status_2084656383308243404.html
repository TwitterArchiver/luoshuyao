  以前一直穿的是一双偏软的工鞋，它是不防滑的。工作的区域地面常有积水，穿这种鞋很容易脚滑。我上了一年多的班，脚滑了无数次只摔了三次，算很幸运了。因为附近有很多金属设备，边边角角的如果磕到头的话可以直接去享福了。
  <br/>
  最近才换上防滑鞋，但是这个鞋唯一的优点就是防滑，它又硬又不透气，穿起来一点也不舒服，穿久了脚会变得黏糊糊的。可能是因为今天鞋子进水了把皮肤泡软了才把脚磨烂的。
