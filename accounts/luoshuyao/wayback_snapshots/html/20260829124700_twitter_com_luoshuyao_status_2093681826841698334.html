  <div class="tweet-content">
  今天早上保洁阿姨跟我说：“你看起来很不开心。”明明只能看到我的眼睛，她一眼就看出来了。听到这句话的时候我才意识到我真的在不开心。就像眨眼和呼吸，提到的时候才会想起来它的存在。我确实一直都是这幅表情。
  <br/>
  让我想起了六年前，还在上小学的侄子也说过同样的话，他说我看起来好像不开心。我很惊讶，我以为我把自己的情绪隐藏得很好，毕竟在家里的时候从来没有人问我是不是不开心，这么多年只有这一次，所以我的印象很深刻。实际上我的表情一直都写在脸上，从来都没有开心过，只是他们毫不在意罢了。
